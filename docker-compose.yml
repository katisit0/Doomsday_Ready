# Start everything: docker compose up --build
# Frontend: http://localhost:5173   API: http://localhost:8000/api

services:
  backend:
    build: ./backend
    environment:
      DB_DATABASE: /data/database.sqlite
    volumes:
      - db-data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db-data:
